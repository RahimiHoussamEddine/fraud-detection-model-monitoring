services:
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      FRAUD_ARTIFACT_DIR: /app/artifacts/v1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health?deep=true', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  app:
    build: .
    command:
      - streamlit
      - run
      - app/main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      FRAUD_ARTIFACT_DIR: /app/artifacts/v1
    restart: unless-stopped
